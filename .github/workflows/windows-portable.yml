name: Windows portable test build

on:
  push:
    branches:
      - teste-1
    paths:
      - '.github/workflows/windows-portable.yml'
      - 'assets/**'
      - 'build/**'
      - 'css/**'
      - 'dist/**'
      - 'electron/**'
      - 'font/**'
      - 'js/**'
      - 'keymaps/**'
      - 'lang/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'themes/**'
      - 'index.html'

jobs:
  build-windows-portable:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout teste-1
        uses: actions/checkout@v5
        with:
          ref: teste-1

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable Windows executable without publisher certificate
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build-electron
          npx electron-builder --windows portable --publish=never --config.win.signExecutable=false

      - name: Package executable in RAR
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist-electron -Filter *.exe -File |
            Where-Object { $_.Name -notmatch 'uninstaller|setup' } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) {
            throw "Portable .exe not found in dist-electron"
          }

          choco install winrar --yes --no-progress
          $rar = Join-Path $env:ProgramFiles 'WinRAR\Rar.exe'
          if (-not (Test-Path $rar)) {
            throw "WinRAR command-line executable not found: $rar"
          }

          $archive = Join-Path (Resolve-Path dist-electron) 'Blockbench-Windows-portable.rar'
          & $rar a -ep1 $archive $exe.FullName
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $archive)) {
            throw "RAR packaging failed"
          }

          & $rar t $archive
          if ($LASTEXITCODE -ne 0) {
            throw "RAR integrity test failed"
          }

          Write-Host "Packaged $($exe.Name) into $archive"

      - name: Upload portable RAR
        uses: actions/upload-artifact@v4
        with:
          name: Blockbench-Windows-portable-RAR
          path: dist-electron/Blockbench-Windows-portable.rar
          if-no-files-found: error
          retention-days: 3
